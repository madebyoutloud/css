packages:
  - .
  - docs

minimumReleaseAge: 10080 # 7 days in minutes
trustPolicyIgnoreAfter: 20160 # 14 days in minutes
blockExoticSubdeps: true

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: false
  vue-demi: true

minimumReleaseAgeExclude:
  - '@outloud/*'
