minimumReleaseAge: 10080 # 7 days in minutes
trustPolicy: off
trustPolicyIgnoreAfter: 20160 # 14 days in minutes
blockExoticSubdeps: true

packages:
  - .
  - docs
  - playground

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: false
  vue-demi: true
