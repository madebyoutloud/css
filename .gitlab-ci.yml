spec:
  inputs:
    action:
      description: What to run, auto runs what the branch or tag runs
      default: auto
      options: [auto, publish, docs]
---
stages: [test, build, deploy, publish]

include:
  - component: $OUTLOUD_CI/workflow@5
    inputs:
      action: $[[ inputs.action ]]

  # test
  - component: $OUTLOUD_CI/test-nodejs@5
    inputs:
      name: lint
      command: lint
  - component: $OUTLOUD_CI/test-nodejs@5
    inputs:
      name: typecheck
      command: typecheck
  - component: $OUTLOUD_CI/test-nodejs@5
    inputs:
      name: test
      command: test

  - component: $OUTLOUD_CI/publish-npm@5
    inputs:
      registry: [npm, gitlab]

  # docs, docs.outloud.dev/css on a Cloudflare Worker
  - component: $OUTLOUD_CI/build-nodejs@5
    inputs:
      name: build:docs
      rules:
        - if: !reference [.rules, default_branch]
          changes:
            - docs/**/*
        - if: $RUN_ACTION == "docs"
      script:
        - |
          export NODE_OPTIONS="--max-old-space-size=4096"
          export NUXT_APP_BASE_URL=/css/
          pnpm install --loglevel warn
          pnpm run build
          cd docs
          pnpm build --preset=cloudflare_module
      output:
        - docs/.output
        - docs/.wrangler

  - component: $OUTLOUD_CI/deploy-cloudflare@5
    inputs:
      name: deploy:docs
      environment: production
      url: https://docs.outloud.dev/css
      rules:
        - if: !reference [.rules, default_branch]
          changes:
            - docs/**/*
        - if: $RUN_ACTION == "docs"
      script:
        - |
          cd docs
          wrangler deploy --keep-vars --name=docs-css
