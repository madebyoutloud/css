spec:
  inputs:
    action:
      description: What to run, auto runs what the branch or tag runs
      default: auto
      options: [auto, publish, docs]
---
stages: [test, build, deploy, publish]

include:
  - component: $OUTLOUD_CI/workflow@5
    inputs:
      action: $[[ inputs.action ]]

  # test
  - component: $OUTLOUD_CI/test-nodejs@5
    inputs:
      name: lint
      command: lint
  - component: $OUTLOUD_CI/test-nodejs@5
    inputs:
      name: typecheck
      command: typecheck
  - component: $OUTLOUD_CI/test-nodejs@5
    inputs:
      name: test
      command: test

  - component: $OUTLOUD_CI/publish-npm@5
    inputs:
      registry: [npm, gitlab]

  # docs, css.byoutloud.com on AWS Amplify
  - component: $OUTLOUD_CI/build-nodejs@5
    inputs:
      name: build:docs
      rules:
        - if: !reference [.rules, default_branch]
          changes:
            - docs/**/*
        - if: $RUN_ACTION == "docs"
      script:
        - |
          apk add --no-cache zip
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm install --loglevel warn
          pnpm run build
          cd docs
          pnpm run generate
          cd .output/public
          zip -r "$CI_PROJECT_DIR/docs.zip" ./*
      output:
        - docs.zip

  - component: $OUTLOUD_CI/deploy-aws@5
    inputs:
      name: deploy:docs
      environment: production
      url: https://css.byoutloud.com
      rules:
        - if: !reference [.rules, default_branch]
          changes:
            - docs/**/*
        - if: $RUN_ACTION == "docs"
      script:
        - |
          ARTIFACT_NAME="${CI_PROJECT_PATH_SLUG}-docs.zip"
          aws s3 cp docs.zip "s3://${AWS_S3_BUCKET}/${ARTIFACT_NAME}"
          aws amplify start-deployment --app-id "$AWS_AMPLIFY_ID" --branch-name "$AWS_AMPLIFY_ENV" --source-url "s3://${AWS_S3_BUCKET}/${ARTIFACT_NAME}"
